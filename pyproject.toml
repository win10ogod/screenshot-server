[project]
name = "screenshot-server"
version = "0.2.1"
description = "MCP Game Streaming Server with DXGI capture and Streamable HTTP transport (SSE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.4.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "windows-capture>=1.4.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
